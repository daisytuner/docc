        DOCC_REUSE_BINARIES: 1
    resnet18_basic_block_run_openmp:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_basic_block.py --n_runs=1 --docc --target=openmp
      energy: true
      env:
        DOCC_CI: regions
        DOCC_REUSE_BINARIES: 1
    resnet18_basic_block_run_cuda:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_basic_block.py --n_runs=1 --docc --target=cuda
      energy: true
      env:
        DOCC_CI: regions
        DOCC_REUSE_BINARIES: 1

    # model resnet18 downsample block

    resnet18_downsample_block_torch:
