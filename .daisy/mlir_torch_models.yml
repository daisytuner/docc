    resnet18_first_half_run_cuda:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_first_half.py --n_runs=1 --docc --target=cuda
      energy: true
      env:
        DOCC_CI: regions
        DOCC_REUSE_BINARIES: 1

    # model resnet18 second half

    resnet18_second_half_torch:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_second_half.py --n_runs=1 --torch
      energy: true
      measurements: 3
    resnet18_second_half_run_sequential:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_second_half.py --n_runs=1 --docc --target=sequential
