on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

parameters:
  container: daisytuner/docc-build-env-llvm19-base:latest-amd64
  timeout: 120
  partitions:
    - chamomile

steps:
  build: |
    add-apt-repository ppa:deadsnakes/ppa -y
    apt-get update

    apt-get install -y python3.11 python3.11-dev python3.11-venv

    python3.11 -m venv venv
    . venv/bin/activate

    python -m pip install --upgrade pip
    pip install pybind11 pytest coverage black==25.9.0 build scikit-build-core
    pip install numpy scipy

    pip install --no-build-isolation -e python/
    pip install --no-build-isolation -e mlir/

    pip install torch==2.10.0+cpu torchvision==0.25.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
    pip install torch-mlir==20260309.746 -f https://github.com/llvm/torch-mlir-release/releases/expanded_assets/dev-wheels

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/bn_conv_bn_relu_maxpool.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/bn_conv_bn_relu_maxpool.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/bn_conv_bn_relu_maxpool.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_bn_relu_conv.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_bn_relu_conv.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_bn_relu_conv.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_basic_block.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_basic_block.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_basic_block.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_downsample_block.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_downsample_block.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_downsample_block.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stage1.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stage1.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stage1.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stage2.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stage2.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stage2.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stem_stage1.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stem_stage1.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stem_stage1.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_first_half.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_first_half.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_first_half.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_second_half.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_second_half.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_second_half.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_avgpool_fc.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_avgpool_fc.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_avgpool_fc.py --n_runs=1 --docc --target=cuda

    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_tail.py --n_runs=1 --docc --target=sequential
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_tail.py --n_runs=1 --docc --target=openmp
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_tail.py --n_runs=1 --docc --target=cuda

    # DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18.py --n_runs=1 --docc --target=none
    # DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18.py --n_runs=1 --docc --target=sequential
    # DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18.py --n_runs=1 --docc --target=openmp
    # DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18.py --n_runs=1 --docc --target=cuda

  run:

    # model BatchNorm -> Convolution -> BatchNorm -> ReLU -> Maxpool

    bn_conv_bn_relu_maxpool_torch:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/bn_conv_bn_relu_maxpool.py --torch
      energy: true
      measurements: 3
    bn_conv_bn_relu_maxpool_run_sequential:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/bn_conv_bn_relu_maxpool.py --docc --target=sequential
      energy: true
      env:
        DOCC_CI: regions
        DOCC_REUSE_BINARIES: 1
    bn_conv_bn_relu_maxpool_run_openmp:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/bn_conv_bn_relu_maxpool.py --docc --target=openmp
      energy: true
      env:
        DOCC_CI: regions
        DOCC_REUSE_BINARIES: 1
    bn_conv_bn_relu_maxpool_run_cuda:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/bn_conv_bn_relu_maxpool.py --docc --target=cuda
      energy: true
      env:
        DOCC_CI: regions
        DOCC_REUSE_BINARIES: 1

    # model resnet18 BN -> ReLU -> Conv

    resnet18_bn_relu_conv_torch:
