    resnet18_bn_relu_conv_run_openmp:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_bn_relu_conv.py --n_runs=1 --docc --target=openmp
      energy: true
      env:
        DOCC_CI: regions
        DOCC_REUSE_BINARIES: 1
    resnet18_bn_relu_conv_run_cuda:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_bn_relu_conv.py --n_runs=1 --docc --target=cuda
