        DOCC_REUSE_BINARIES: 1
    resnet18_stem_stage1_run_openmp:
      command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/resnet18_stem_stage1.py --n_runs=1 --docc --target=openmp
