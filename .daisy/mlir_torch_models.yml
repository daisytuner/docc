on:
  push:
    branches:
      - main
      - runner-tests
  pull_request:
    types: [opened, reopened, synchronize]

parameters:
  container: daisytuner/docc-run-env-llvm21-ubuntu-24.04:latest-amd64
  timeout: 120
  docc_version: ~
  partitions:
    - localRunners

steps:
  build: |
    python3.11 -m venv venv
    . venv/bin/activate

    python -m pip install --upgrade pip
    pip install pybind11 pytest coverage build scikit-build-core
    pip install numpy scipy transformers ml_dtypes

    pip install --no-build-isolation -e python/
    pip install --no-build-isolation -e mlir/

    pip install -r mlir/requirements-cuda.txt

    # Warm start
    export DOCC_DEBUG=dump
    export DOCC_CUDA_ARCH=sm_120

    # venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --n_runs=1 --device cpu --variant segformer --batch-size 16
    venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --n_runs=1 --device cuda --variant segformer --batch-size 16
    # venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --n_runs=1 --device docc --target=openmp --variant segformer --batch-size 16 --remote-tuning
    venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --n_runs=1 --device docc --target=cuda --variant segformer --batch-size 16 --remote-tuning


    # DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --n_runs=1 --device docc --target=openmp --variant segformer --batch-size 16 --remote-tuning
    DOCC_CI=regions venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --n_runs=1 --device docc --target=cuda --variant segformer --batch-size 16 --remote-tuning

  run:
    segformer:
      energy: true
      control: true
      measurements: 3
      env:
        DOCC_REUSE_BINARIES: 1
        NVIDIA_TF32_OVERRIDE: 1
        DOCC_CUDA_ARCH: sm_120
      variants:
        # torch:
        #   command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --device cpu --n_runs=1 --variant segformer --batch-size 16
        #   tags: { framework: torch, device: cpu, model: openmp, precision: float, baseline: true }
        torch-cuda:
          command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --device cuda --n_runs=1 --variant segformer --batch-size 16
          tags: { framework: torch, device: gpu, model: cuda, precision: float, baseline: true }
        # docc-omp:
        #   command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --device docc --target=openmp --n_runs=1 --variant segformer --batch-size 16 --remote-tuning
        #   tags: { framework: docc, device: cpu, model: openmp, precision: float, remote-tuning: true }
        # docc-omp-prof:
        #   command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --device docc --target=openmp --n_runs=1 --variant segformer --batch-size 16 --remote-tuning
        #   tags: { framework: docc, device: cpu, model: openmp, precision: float, profiling: true, remote-tuning: true }
        #   metrics: ["flop_fp64", "flop_fp32", "dram_volume", "l2_volume"]
        docc-cuda:
          command: venv/bin/python3 mlir/benchmarks/torch/model_zoo/segformer.py --device docc --target=cuda --n_runs=1 --variant segformer --batch-size 16 --remote-tuning
          tags: { framework: docc, device: gpu, model: cuda, precision: float, remote-tuning: true }
