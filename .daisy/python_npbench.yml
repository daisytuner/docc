      energy: true
      env:
        DOCC_CI: regions
    atax_seq_tuning:
      command: venv/bin/python3 python/benchmarks/npbench/polybench/test_atax.py --docc --size=M --target=sequential --remote-tuning
      energy: true
      env:
        DOCC_CI: regions
    gemm_numpy:
