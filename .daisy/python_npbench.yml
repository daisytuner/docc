on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

parameters:
  container: daisytuner/docc-run-env-llvm19-ubuntu-24.04:latest-amd64
  timeout: 120
  partitions:
    - zinnia

steps:
  build: |
    apt-get install -y python3-venv python3-pip

    python3 -m venv venv
    . venv/bin/activate

    python -m pip install --upgrade pip
    pip install pybind11 pytest coverage black==25.9.0 build scikit-build-core
    pip install numpy scipy cupy-cuda12x

    pip install --no-build-isolation -v -e python/

    export DOCC_DEBUG=dump

    # Compile and cache binaries
    venv/bin/python3 python/benchmarks/npbench/deep_learning/mlp/test_mlp.py --docc --size=M --n_runs=1 --target=cuda --remote-tuning

    # Compile and cache instrumented binaries for profiling
    DOCC_CI=regions venv/bin/python3 python/benchmarks/npbench/deep_learning/mlp/test_mlp.py --docc --size=M --n_runs=1 --target=cuda --remote-tuning

  run:
    mlp:
      energy: true
      measurements: 10
      control: true
      env:
        DOCC_REUSE_BINARIES: 1
      variants:
        numpy:
          command: venv/bin/python3 python/benchmarks/npbench/deep_learning/mlp/test_mlp.py --numpy --size=M --n_runs=1
          tags: { framework: numpy, device: cpu, model: openmp, precision: double, baseline: true }
        docc-cuda:
          command: venv/bin/python3 python/benchmarks/npbench/deep_learning/mlp/test_mlp.py --docc --size=M --n_runs=1 --target=cuda --remote-tuning
          tags: { framework: docc, device: gpu, model: cuda, precision: double }
        docc-cuda-prof:
          command: venv/bin/python3 python/benchmarks/npbench/deep_learning/mlp/test_mlp.py --docc --size=M --n_runs=1 --target=cuda --remote-tuning
          tags: { framework: docc, device: gpu, model: cuda, precision: double, profiling: true }
          metrics: ["cuda:::flop_fp64", "cuda:::flop_fp32", "cuda:::flop_fp16", "cuda:::flop_tensor_fp16", "cuda:::l1_volume", "cuda:::l2_volume", "cuda:::dram_volume", "cuda:::occupancy", "cuda:::stalls"]
