name: Type Check

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typing:
    timeout-minutes: 30
    runs-on:
      group: dahlia
      labels: Linux
    container:
      image: daisytuner/docc-run-env-llvm21-ubuntu-24.04-host:latest-amd64
      options: >-
        --cap-add=PERFMON

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Prepare workspace
        uses: ./.github/actions/prepare-workspace

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pytorch/requirements.txt

      - name: Build frontends
        run: |
          pip install --no-build-isolation \
            -Ccmake.build-type=Debug \
            -v -e python/
          pip install --no-build-isolation \
            -v -e pytorch/

      - name: Check Typing
        run: |
          pip install pybind11-stubgen
          ./scripts/generate-pybind-stubs.py
          pyright -p pytorch/
