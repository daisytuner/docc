name: Release

# A release is started by hand ("Run workflow"). MAJOR.MINOR comes from VERSION_BASE; the patch number
# is allocated by the Daisytuner backend, so there is no version file to bump and no tag to push.
#
# This workflow builds and stages a release without making it public, to leave room for a soak period:
# the wheels and native packages go into a draft GitHub release v<version> (visible only to people with
# write access), the native packages also go to the Daisytuner backend unpublished, and the docs image is
# pushed as docc-docs:<version>. The Promote workflow then publishes it to PyPI, GitHub and the docs site.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: preview the next version and build everything, but allocate and publish nothing"
        type: boolean
        default: false

jobs:
  # Stage 0: Get this release's version from the backend. This is the only job that talks to the release
  # ledger; every build job receives the number through DOCC_RELEASE_VERSION, so all artifacts of one release
  # carry the same version (CMake and scripts/docc_version.py read it).
  allocate-version:
    name: Allocate version
    runs-on: ubuntu-24.04
    outputs:
      release_version: ${{ steps.allocate.outputs.release_version }}

    steps:
      # Only VERSION_BASE is needed from the checkout.
      - uses: actions/checkout@v7

      - name: Allocate release version
        id: allocate
        env:
          RELEASES_API: https://europe-west1-daisy-367210.cloudfunctions.net/v1/system/releases/docc #TODO: Ideally it should be taken from secrets.
          # Daisy admin org session token; the same one the distribution upload below uses.
          TOKEN: ${{ secrets.DOCC_RELEASE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Real releases only from main, or from release/** branches for hotfixes on an older
          # MAJOR.MINOR series. Dry runs allocate and publish nothing, so they may run from any branch.
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ] && [[ "$GITHUB_REF" != refs/heads/release/* ]]; then
            echo "::error::Releases are only published from main or release/** (this run: $GITHUB_REF). Use dry_run to test other branches."
            exit 1
          fi

          BASE=$(head -n 1 VERSION_BASE | tr -d '[:space:]')
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION_BASE must contain MAJOR.MINOR (e.g. 0.8), got '$BASE'"
            exit 1
          fi

          # Dry runs only preview the next version. Real runs reserve it; the backend returns the same
          # version again for the same run_id, so re-running this workflow run doesn't use up a patch.
          if [ "$DRY_RUN" = "true" ]; then
            RESPONSE=$(curl -sS --fail-with-body -H "Authorization: Token $TOKEN" \
              "$RELEASES_API/next?base=$BASE")
          else
            BODY=$(jq -n --arg base "$BASE" --arg run_id "$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" \
              '{base: $base, run_id: $run_id, commit: $commit}')
            RESPONSE=$(curl -sS --fail-with-body -X POST -H "Authorization: Token $TOKEN" \
              -H "Content-Type: application/json" -d "$BODY" "$RELEASES_API/allocate")
          fi
          VERSION=$(jq -r '.version // empty' <<< "$RESPONSE")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected response from the release ledger: $RESPONSE"
            exit 1
          fi

          # Sanity check before an hour of builds: a version already on PyPI means the backend ledger is
          # out of sync (e.g. seeded too low). Skipped on re-runs, where this run may have published it.
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/docc-compiler/$VERSION/json")
            if [ "$STATUS" != "404" ]; then
              echo "::error::docc-compiler $VERSION already exists on PyPI (HTTP $STATUS). Check releases/docc in the backend."
              exit 1
            fi
          fi

          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: would release docc $VERSION (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Releasing docc $VERSION (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Stage 1: Build docc-compiler
  wheels-compiler:
    name: Compiler (${{ matrix.os }}, ${{ matrix.python }})
    needs: [allocate-version]
    runs-on: ${{ matrix.os }}
    env:
      DOCC_RELEASE_VERSION: ${{ needs.allocate-version.outputs.release_version }}

    strategy:
      fail-fast: false
      matrix:
        os: [build-amd64-big, build-arm64-big, macos-14]
        python: ["cp311", "cp312", "cp313", "cp314"]
        include:
          - os: build-amd64-big
            cibw_archs: x86_64
          - os: build-arm64-big
            cibw_archs: aarch64
          - os: macos-14
            cibw_archs: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: python/
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD: "${{ matrix.python }}-*"
          # Linux wheels build in a manylinux container, which doesn't inherit the job environment.
          CIBW_ENVIRONMENT_PASS_LINUX: DOCC_RELEASE_VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-docc-compiler-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  # Stage 2: Build docc-ai (depends on docc-compiler)
  wheels-ai:
    name: AI (${{ matrix.os }}, ${{ matrix.python }})
    needs: [allocate-version, wheels-compiler]
    runs-on: ${{ matrix.os }}
    env:
      DOCC_RELEASE_VERSION: ${{ needs.allocate-version.outputs.release_version }}

    strategy:
      fail-fast: false
      matrix:
        os: [build-amd64-big, build-arm64-big, macos-14]
        python: ["cp311", "cp312"]
        include:
          - os: build-amd64-big
            cibw_archs: x86_64
          - os: build-arm64-big
            cibw_archs: aarch64
          - os: macos-14
            cibw_archs: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # Pin docc-compiler version to match release
      # - name: Pin docc-compiler version
      #   run: |
      #     sed -i.bak "s/\"docc-compiler\"/\"docc-compiler==$DOCC_RELEASE_VERSION\"/" mlir/pyproject.toml && rm mlir/pyproject.toml.bak

      # Download compiler wheels into the package directory so they're available in container
      # - uses: actions/download-artifact@v4
      #   with:
      #     pattern: wheels-docc-compiler-${{ matrix.os }}-*
      #     path: mlir/compiler-wheels
      #     merge-multiple: true

      - uses: pypa/cibuildwheel@v3.3.1
        with:
          package-dir: mlir/
          output-dir: wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD: "${{ matrix.python }}-*"
          # Linux wheels build in a manylinux container, which doesn't inherit the job environment.
          CIBW_ENVIRONMENT_PASS_LINUX: DOCC_RELEASE_VERSION
          # Install docc-compiler before building docc-ai
          # CIBW_BEFORE_BUILD: "pip install --no-index --find-links {project}/compiler-wheels docc-compiler"
          # Make compiler wheels available for dependency resolution during test
          # CIBW_ENVIRONMENT: "PIP_FIND_LINKS={project}/compiler-wheels"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-docc-ai-${{ matrix.os }}-${{ matrix.python }}
          path: wheelhouse/*.whl

  # docc-pytorch is pure Python, so a single py3-none-any wheel covers all platforms
  wheels-pytorch:
    name: PyTorch
    needs: [allocate-version, wheels-compiler]
    runs-on: build-amd64-big
    container:
      image: daisytuner/docc-run-env-llvm21-ubuntu-24.04:latest-amd64
    env:
      DOCC_RELEASE_VERSION: ${{ needs.allocate-version.outputs.release_version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin docc-compiler version
        run: |
          sed -i.bak "s/\"docc-compiler\"/\"docc-compiler==$DOCC_RELEASE_VERSION\"/" pytorch/pyproject.toml && rm pytorch/pyproject.toml.bak
          grep -q "\"docc-compiler==$DOCC_RELEASE_VERSION\"" pytorch/pyproject.toml

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --wheel --outdir pytorch/dist pytorch/
          twine check pytorch/dist/*

      - uses: actions/download-artifact@v4
        with:
          name: wheels-docc-compiler-build-amd64-big-cp312
          path: compiler-wheels

      - name: Smoke test
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install \
            --find-links compiler-wheels \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            pytorch/dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -c "import docc.pytorch; print('docc-pytorch imported successfully')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-docc-pytorch
          path: pytorch/dist/*.whl

  packages-llvm:
    strategy:
      matrix:
        include:
          - platform: ubuntu-24.04
            package-format: deb
            cpack-generator: DEB
            upload-dist-id: ubuntu
            upload-dist-version: 24.04
            runner: build-amd64-big
            architecture: x64
            image: daisytuner/docc-build-env-llvm21-ubuntu-24.04:latest-amd64
          - platform: ubuntu-26.04
            package-format: deb
            cpack-generator: DEB
            upload-dist-id: ubuntu
            upload-dist-version: 26.04
            runner: build-amd64-big
            architecture: x64
            image: daisytuner/docc-build-env-llvm21-ubuntu-26.04:latest-amd64
          - platform: ubuntu-24.04
            package-format: deb
            cpack-generator: DEB
            upload-dist-id: ubuntu
            upload-dist-version: 24.04
            runner: build-arm64-big
            architecture: arm64
            image: daisytuner/docc-build-env-llvm21-ubuntu-24.04:latest-arm64
          - platform: rhel-10
            package-format: rpm
            cpack-generator: RPM
            upload-dist-id: rhel
            upload-dist-version: 10
            upload-dist-platform-id: platform:el10
            runner: build-amd64-big
            architecture: x64
            image: daisytuner/docc-build-env-llvm21-rhel-10:latest-amd64
          - platform: debian-13
            package-format: deb
            cpack-generator: DEB
            upload-dist-id: debian
            upload-dist-version: 13
            runner: build-amd64-big
            architecture: x64
            image: daisytuner/docc-build-env-llvm21-debian-13:latest-amd64

    needs: [allocate-version]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      DOCC_RELEASE_VERSION: ${{ needs.allocate-version.outputs.release_version }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build package
        run: |
          mkdir -p build
          cd build
          cmake -G Ninja \
            -DCMAKE_C_COMPILER=clang-21 \
            -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_BUILD_TYPE=Release \
            -DINSTALL_GTEST=OFF \
            -DBUILD_TESTS:BOOL=OFF \
            -DLLVM_BUILD_FRONTEND=ON \
            -DLLVM_BUILD_TESTS=OFF \
            -DBUILD_BENCHMARKS:BOOL=OFF \
            -DBUILD_BENCHMARKS_GOOGLE:BOOL=OFF \
            -DPACKAGE_WITH_TOOL_DEPS=ON \
            ..
          ninja -j$(nproc)
          cpack -G ${{ matrix.cpack-generator }}

      - name: Upload docc package as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docc-${{ matrix.platform }}-${{ matrix.architecture }}
          path: "build/*.${{ matrix.package-format }}"

      # The backend stores new distributions unpublished; an admin publishes them after promoting.
      - name: Upload docc package to Firebase
        if: ${{ !inputs.dry_run }}
        uses: daisytuner/upload-distribution-action@main
        with:
          file: "build/*.${{ matrix.package-format }}"
          version: ${{ env.DOCC_RELEASE_VERSION }}
          architecture: ${{ matrix.architecture }}
          dist-id: ${{ matrix.upload-dist-id }}
          dist-version: ${{ matrix.upload-dist-version }}
          dist-platform-id: ${{ matrix.upload-dist-platform-id }}
          token: ${{ secrets.DOCC_RELEASE_TOKEN }}
          url: /v1/system/docc-distributions/upload

  # Stage 3: Build the docs of this release and stage the image as docc-docs:<version>; the Promote workflow
  # deploys it. Only main stages: a hotfix release from release/** would replace the docs of a newer series
  # with older content (and the push's Google Cloud identity only accepts main anyway). Dry runs build the
  # docs as a smoke test, with the previewed version, and push nothing.
  docs:
    needs: [allocate-version]
    if: ${{ inputs.dry_run || github.ref == 'refs/heads/main' }}
    # A called workflow gets at most the permissions of its calling job; the push logs in to Google Cloud
    # keylessly (OIDC), so no secret is passed.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      version: ${{ needs.allocate-version.outputs.release_version }}
      deploy: false
      stage: ${{ !inputs.dry_run }}

  # Stage 4: Collect the wheels and native packages into a draft GitHub release v<version>, with release notes
  # generated from the merged PRs (grouped by .github/release.yml). Drafts are only visible to people with
  # write access, and their tag is only created when the Promote workflow publishes them. Dry runs only show
  # the notes.
  draft-release:
    name: Draft GitHub release
    needs: [allocate-version, wheels-compiler, wheels-ai, wheels-pytorch, packages-llvm, docs]
    # docs is skipped for releases from release/**; !cancelled() && !failure() still stops this job when a
    # build job failed.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.allocate-version.outputs.release_version }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      # gh release has no checkout to infer the repository from.
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: assets
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: docc-*
          path: assets
          merge-multiple: true

      - name: Write checksums
        working-directory: assets
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Create draft release
        run: |
          set -euo pipefail
          TAG="v$VERSION"

          # A re-run of this run replaces its own draft; a published release or an existing tag means the
          # version was already released.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Check releases/docc in the backend."
            exit 1
          fi
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          if [ -n "$EXISTING" ]; then
            read -r ID IS_DRAFT <<< "$EXISTING"
            if [ "$IS_DRAFT" != "true" ]; then
              echo "::error::Release $TAG is already published."
              exit 1
            fi
            if [ "$DRY_RUN" != "true" ]; then
              echo "Replacing the existing draft of $TAG"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$ID"
            fi
          fi

          # The notes cover the changes since the closest earlier release tag, so a hotfix of an older
          # series is compared against its own series.
          PREV=$( { gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name'; echo "$TAG"; } \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV | awk -v t="$TAG" '$0 == t { print p; exit } { p = $0 }')
          ARGS=(-f "tag_name=$TAG" -f "target_commitish=$GITHUB_SHA")
          if [ -n "$PREV" ]; then
            ARGS+=(-f "previous_tag_name=$PREV")
          fi
          GENERATED=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${ARGS[@]}" --jq .body)

          {
            echo "<!-- Soak period: edit these notes (e.g. add a Highlights section) before running the Promote workflow. -->"
            echo "## Install"
            echo
            echo '```sh'
            echo "pip install docc-compiler==$VERSION   # NumPy"
            echo "pip install docc-ai==$VERSION         # PyTorch"
            echo '```'
            echo
            echo "Native packages for Ubuntu, Debian and RHEL are attached below (\`sudo apt install ./docc-llvm_${VERSION}-<distro>_<arch>.deb\`"
            echo "or \`sudo dnf install ./docc-llvm_${VERSION}-<distro>_<arch>.rpm\`); \`SHA256SUMS\` lists the checksums of all files."
            echo
            echo "$GENERATED"
          } > notes.md

          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### Dry run: release notes of $TAG (since ${PREV:-the first commit})"
              echo
              cat notes.md
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          FILES=(assets/*)
          URL=$(gh release create "$TAG" "${FILES[@]}" --draft --target "$GITHUB_SHA" \
            --title "docc $VERSION" --notes-file notes.md)
          {
            echo "Drafted [$TAG]($URL) with ${#FILES[@]} files."
            echo
            echo "After the soak period, run the Promote workflow with version $VERSION to publish it."
          } >> "$GITHUB_STEP_SUMMARY"
