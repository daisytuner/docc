name: Docs

# Builds docs.daisytuner.com/docc with daisytuner/docs-platform (configured by docs.config.json).
# PRs that touch the docs only build; main deploys to Cloud Run on changes, nightly (to pick up
# platform changes) and on demand.

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs.config.json"
      - "python/README.md"
      - "tutorial/printf_target/target_tutorial.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "docs.config.json"
      - "python/README.md"
      - "tutorial/printf_target/target_tutorial.md"
      - "VERSION"
      - "sdfg/include/**"
      - "opt/include/**"
      - "llvm/include/**"
      - "mlir/include/**"
      - "c-compile/include/**"
      - "rpc/include/**"
      - "rtl/include/**"
      - "arg-capture-io/include/**"
      - "targets/et/include/**"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: daisytuner/docs-platform/.github/workflows/build-project.yml@main
    with:
      export-image: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: docc-docs
      REGISTRY: europe-west1-docker.pkg.dev/daisy-367210/developer-docs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Load image
        id: image
        run: |
          docker load < docs-image.tar.gz
          echo "ref=${REGISTRY}/${SERVICE}:${GITHUB_RUN_ID}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Keyless: the provider only accepts daisytuner/docc on refs/heads/main.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1080482399950/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-docc-docs-publisher@daisy-367210.iam.gserviceaccount.com
          token_format: access_token

      - name: Docker auth for Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker tag docs:build "$IMAGE"
          docker push "$IMAGE"

      # No access flags: docc-docs is already public and the publisher can't change its IAM policy.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          image: ${{ steps.image.outputs.ref }}
          region: europe-west1
          project_id: daisy-367210
          flags: --port 8080 --cpu 1 --memory 256Mi --min-instances 0 --max-instances 3 --concurrency 80 --service-account docc-docs@daisy-367210.iam.gserviceaccount.com

      - name: Check deployed site
        env:
          URL: ${{ steps.deploy.outputs.url }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          curl -fsS -o /dev/null "$URL/docc/intro"
          echo "Deployed $IMAGE -> $URL" | tee -a "$GITHUB_STEP_SUMMARY"
