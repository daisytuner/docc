name: Docs

# Builds docs.daisytuner.com/docc with daisytuner/docs-platform (configured by docs.config.json).
# The site shows the docs of the latest release: the Release workflow calls this workflow after publishing
# and passes the version it released, which no repo file records. PRs that touch the docs only build.
# A manual run redeploys main in between releases (e.g. to pick up docs-platform changes) and needs the
# currently released version typed in.

on:
  pull_request:
    paths:
      - "docs/**"
      - "docs.config.json"
      - "python/README.md"
      - "tutorial/printf_target/target_tutorial.md"
      - ".github/workflows/docs.yml"
  # Both entry points take the same inputs. A called workflow sees the caller's event, so github.event_name
  # is workflow_dispatch for a call from Release too; `deploy` is what tells a dry run from a real one.
  # On pull_request runs the inputs are null: `inputs.deploy == true` is then false (`!= false` would not
  # be, since null == false in expressions) and `inputs.version` is empty, so the docs show VERSION_BASE.
  workflow_dispatch:
    inputs:
      version:
        description: "Released version to show, e.g. 0.8.3 (the latest release, see PyPI or the last Release run)"
        type: string
        required: true
      deploy:
        description: "Deploy the site (untick to only build)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      version:
        description: "Version being released, e.g. 0.8.3"
        type: string
        required: true
      deploy:
        description: "Deploy the site (false for release dry runs)"
        type: boolean
        default: true

permissions:
  contents: read

# Only superseded PR builds are cancelled. Deploys queue instead, so a manual run never cancels the docs
# job of a release (which would mark the whole release run as cancelled).
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: daisytuner/docs-platform/.github/workflows/build-project.yml@main
    with:
      # The single place that decides whether to deploy: only main, and only when asked to (not PRs, not
      # release dry runs). The deploy job runs when this exported an image.
      export-image: ${{ inputs.deploy == true && github.ref == 'refs/heads/main' }}
      version: ${{ inputs.version }}

  deploy:
    needs: build
    # build-project.yml names an artifact only when it exported the image.
    if: needs.build.outputs.artifact != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: docc-docs
      REGISTRY: europe-west1-docker.pkg.dev/daisy-367210/developer-docs
    steps:
      # The release passes an already validated version; this catches typos in manual runs before
      # anything is pushed. (The image was built with the bad value, but it is never published.)
      - name: Check version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH (e.g. 0.8.3), got '$VERSION'"
            exit 1
          fi
          echo "Deploying the docs of docc $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}

      - name: Load image
        id: image
        run: |
          docker load < docs-image.tar.gz
          echo "ref=${REGISTRY}/${SERVICE}:${GITHUB_RUN_ID}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Keyless: the provider accepts daisytuner/* repos on refs/heads/main (so hotfix releases from
      # release/** can't deploy), and the service account's binding limits it to daisytuner/docc.
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1080482399950/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gh-docc-docs-publisher@daisy-367210.iam.gserviceaccount.com
          token_format: access_token

      - name: Docker auth for Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Push image
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker tag docs:build "$IMAGE"
          docker push "$IMAGE"

      # No access flags: docc-docs is already public and the publisher can't change its IAM policy.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          image: ${{ steps.image.outputs.ref }}
          region: europe-west1
          project_id: daisy-367210
          flags: --port 8080 --cpu 1 --memory 256Mi --min-instances 0 --max-instances 3 --concurrency 80 --service-account docc-docs@daisy-367210.iam.gserviceaccount.com

      - name: Check deployed site
        env:
          URL: ${{ steps.deploy.outputs.url }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          curl -fsS -o /dev/null "$URL/docc/intro"
          echo "Deployed $IMAGE -> $URL" | tee -a "$GITHUB_STEP_SUMMARY"
