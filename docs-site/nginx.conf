server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects keep the external host/scheme behind Firebase Hosting or a load balancer.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        # trailingSlash=false emits docs/intro.html for the route /docs/intro.
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Docusaurus asset filenames are content-hashed; add_header here replaces the server-level ones.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
